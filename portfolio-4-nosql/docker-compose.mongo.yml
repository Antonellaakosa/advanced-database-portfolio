# =====================================================================
# Unity Public Library Network (UPLN) | MIT 8103 | Portfolio 4
# MongoDB for the catalogue. A separate file, so the PostgreSQL setup from
# Portfolio 1 is not changed in any way.
#   start : docker compose -f portfolio-4-nosql/docker-compose.mongo.yml up -d
#   stop  : docker compose -f portfolio-4-nosql/docker-compose.mongo.yml down
# The folder is mounted read-only at /p4 so mongosh can run the scripts in it.
# Lab setup: no login and reachable only from this machine (127.0.0.1).
# See README section "What I would change for production".
# =====================================================================
services:
  mongo:
    image: mongo:7
    container_name: upln_mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - upln_mongo_data:/data/db
      - ./:/p4:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  upln_mongo_data:
