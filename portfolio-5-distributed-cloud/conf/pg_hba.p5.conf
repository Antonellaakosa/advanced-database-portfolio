# =====================================================================
# UPLN | MIT 8103 | Portfolio 5 | who may connect, from where, and how
# First matching line wins. Everything must use TLS and a SCRAM password,
# and the servers only listen on 127.0.0.1 anyway.
# =====================================================================
# TYPE    DATABASE     USER         ADDRESS          METHOD
# a local socket exists only INSIDE the server's own container: whoever is there is already the administrator
local     all          all                           trust
# the replication account may stream WAL, and may NOT open a normal SQL session
hostssl   replication  replicator   127.0.0.1/32     scram-sha-256
hostssl   all          replicator   0.0.0.0/0        reject
# everyone else: TLS + password, from this machine only
hostssl   all          all          127.0.0.1/32     scram-sha-256
# anything else (including a connection without TLS) is refused
host      all          all          0.0.0.0/0        reject
