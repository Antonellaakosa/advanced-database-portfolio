# =====================================================================
# UPLN | MIT 8103 | Portfolio 5 | settings shared by every node
# (paths, ports and TLS file locations are passed on the command line,
#  because they differ between Docker and a plain local test)
# =====================================================================
listen_addresses = '*'
max_connections = 50

# --- security ---
password_encryption = scram-sha-256
ssl = on
ssl_min_protocol_version = 'TLSv1.2'
ssl_prefer_server_ciphers = on
log_connections = on
log_disconnections = on
log_line_prefix = '%m [%p] %u@%d '

# --- replication and recovery ---
wal_level = replica
max_wal_senders = 6
max_replication_slots = 6
wal_keep_size = 256MB
hot_standby = on
archive_mode = on
archive_timeout = 60
